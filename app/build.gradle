plugins { id 'com.android.application' }
android {
    namespace 'cn.spacepup.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.spacepup.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.1.4'
        testInstrumentationRunner 'cn.spacepup.app.ReplayInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.androidTest.java.srcDir '../verification'
}
dependencies {
    implementation 'com.google.ar:core:1.48.0'
    implementation 'org.opencv:opencv:4.12.0'
}
